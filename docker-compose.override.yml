# Local host-port remapping to avoid clashes with other services on this box.
# Auto-merged by `docker compose` on top of docker-compose.yml.
#
# Why these:
#   - 3100  → 3101  : host 3100 is taken by Loki
#   - 5433  : already the default mapping (host 5433 → container 5432); kept explicit
#   - 6379  : free on host; left as-is
#   - 8000  : free on host; left as-is
#   - 3001  : free on host (web -> container 3000); left as-is

services:
  mcp-shopify:
    ports: !override
      - "3101:3100"
    # The upstream healthcheck uses `curl`, which isn't installed in the node-slim
    # image, so Docker marked the container unhealthy even though /health returns 200.
    # Use node's built-in http module instead.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3

  # Make the orchestrator (and anything that joins the network) use the in-network
  # hostname for mcp-shopify. From the host the same service is at localhost:3101.
  orchestrator:
    environment:
      - MCP_SHOPIFY_URL=http://mcp-shopify:3100
    # Same curl-missing issue as mcp-shopify; switch to python stdlib.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
