# Server-only overrides (excluded from Jenkins rsync).
# - Web package.json runs Next on 3007; publish host 3001 -> 3007.
# - Host 3100 is taken by Loki; publish mcp-shopify on 3101.
# - Healthchecks avoid curl (not present in node/python slim images).
services:
  web:
    ports: !override
      - "3001:3007"

  mcp-shopify:
    ports: !override
      - "3101:3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3

  orchestrator:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
