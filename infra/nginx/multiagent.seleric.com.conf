# /etc/nginx/sites-available/multiagent.seleric.com
#
# Public entrypoint for the multi-agent stack running locally on this host.
#   /                       -> Next.js web (container `multiagent-web`, host :3001)
#   /api/orchestrator/...   -> FastAPI orchestrator (`multiagent-orchestrator`, host :8000)
#   /ws/...                 -> Orchestrator websocket (same upstream)
#
# Install:
#   sudo cp /opt/seleric/seleric_systems/infra/nginx/multiagent.seleric.com.conf \
#           /etc/nginx/sites-available/multiagent.seleric.com
#   sudo ln -s /etc/nginx/sites-available/multiagent.seleric.com \
#              /etc/nginx/sites-enabled/multiagent.seleric.com
#
#   # Issue / renew the TLS cert (DNS for multiagent.seleric.com must point here first):
#   sudo certbot --nginx -d multiagent.seleric.com
#
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name multiagent.seleric.com;

    # ACME http-01 challenge (used by certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name multiagent.seleric.com;

    ssl_certificate     /etc/letsencrypt/live/multiagent.seleric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multiagent.seleric.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;

    # ── FastAPI orchestrator ───────────────────────────────────────────────
    # Hit https://multiagent.seleric.com/api/orchestrator/health, /signal, /docs, ...
    location /api/orchestrator/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Orchestrator websocket (used by NEXT_PUBLIC_WS_URL) ────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Next.js web app ────────────────────────────────────────────────────
    # Next.js HMR / streaming requires keep-alive + websocket headers.
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
